<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f0f0;font-family:'Segoe UI',Arial,sans-serif}
.card-container{width:420px}
.card{background:#1a2456;border:3px solid #c5a55a;border-radius:12px;padding:22px 26px 18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.logo-row{display:flex;align-items:center;gap:14px}
.logo-row img{width:65px;height:65px}
.logo-text{color:#c5a55a}

.logo-text .subtitle{font-size:8.5px;letter-spacing:1.2px;margin-top:2px}

.name{font-size:21px;font-weight:700;color:#ffffff;margin-bottom:2px}
.title{font-size:13px;color:#c5a55a;font-style:italic;margin-bottom:10px}
.detail{font-size:12.5px;color:#c5a55a;line-height:1.7}
.detail a{color:#c5a55a;text-decoration:none}
.bottom-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.bottom-row .web{font-size:11.5px;color:#c5a55a}
.bottom-row .gbf{font-size:15px;font-weight:700;color:#c5a55a}
.btn-container{margin-top:16px;text-align:center}
.btn{display:inline-block;background:#1a2456;color:#c5a55a;text-decoration:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;border:2px solid #c5a55a;cursor:pointer;transition:background .2s}
.btn:hover{background:#0f1638}
</style>
